[workspace]
members = [".", "crates/container-image-builder", "crates/vm-image-builder"]

[package]
name = "openshell-image-builder"
version = "0.12.0-next"
edition = "2024"

[features]
# Enables the `--runtime vm` backend. Off by default: it links against
# libkrun, which must be installed at build time and only exists for macOS
# on Apple Silicon. Without it `--runtime vm` parses but reports that the
# binary was built without VM support.
default = []
vm = ["vm-image-builder/krun"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
container-image-builder = { path = "crates/container-image-builder" }
dirs = "5"
env_logger = "0.11"
flate2 = "1"
kdn-workspace-configuration = { git = "https://github.com/openkaiden/kdn-api", tag = "v0.14.0" }
log = "0.4"
oci-spec = { version = "0.7", features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
ureq = "2"
url = "2"
vm-image-builder = { path = "crates/vm-image-builder" }
zstd = "0.13"

# build.rs compresses the VM rootfs tarball it embeds and records a digest of
# it, which `src/vm_rootfs.rs` uses as the cache key for its extraction.
[build-dependencies]
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
ctor = "0.2"
