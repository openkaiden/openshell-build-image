[workspace]
members = [".", "crates/addon-rules", "crates/container-image-builder", "crates/vm-image-builder", "crates/vm-guest-helper"]
default-members = [".", "crates/addon-rules", "crates/container-image-builder", "crates/vm-image-builder", "crates/vm-guest-helper"]

[workspace.package]
version = "0.13.0-next"

[package]
name = "openshell-build-image"
version.workspace = true
edition = "2024"

[features]
# Enables the `--runtime vm` backend. Off by default: it links against
# libkrun, which must be installed at build time and only exists for macOS
# on Apple Silicon. Without it `--runtime vm` parses but reports that the
# binary was built without VM support.
default = []
vm = ["vm-image-builder/krun"]

[dependencies]
addon-rules = { path = "crates/addon-rules" }
clap = { version = "4", features = ["derive"] }
container-image-builder = { path = "crates/container-image-builder" }
dirs = "5"
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
vm-image-builder = { path = "crates/vm-image-builder" }
zstd = "0.13"

# build.rs compresses the VM rootfs tarball it embeds and records a digest of
# it, which `src/vm_rootfs.rs` uses as the cache key for its extraction.
[build-dependencies]
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
ctor = "0.2"
libc = "0.2"
regex = "1"
