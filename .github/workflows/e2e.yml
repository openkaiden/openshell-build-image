name: "OpenShell E2E"
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: "read"
env:
  E2E_BOOTSTRAP_IMAGE: "docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55"
defaults:
  run:
    shell: "bash"
jobs:
  podman:
    name: "Podman on Linux (${{ matrix.name }})"
    runs-on: "ubuntu-26.04"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ubuntu"
            # buildpack-deps:noble-curl; multi-architecture manifest.
            image: "docker.io/library/buildpack-deps@sha256:48a80dfb7e2f2d1e93dbfff934fd2f187f306eef36cb5359ef8bba0ffe9205b3"
          - name: "alpine"
            # alpine/curl:8.22.0; multi-architecture manifest.
            image: "docker.io/alpine/curl@sha256:3f21f10cf24835f7baae20931f18640cc30915ea4151363fe4d8fb59ee296dfb"
    env:
      E2E_BASE_IMAGE: "${{ matrix.image }}"
      E2E_DRIVER: "podman"
      E2E_ARTIFACTS: "target/e2e/podman/${{ matrix.name }}"
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 stable
        with:
          toolchain: "stable"

      - name: "Install Podman"
        uses: redhat-actions/podman-install@4a134a65f7324b2d03498c672cd4c6bce93e94b5 # v1.1.1
        with:
          start-service: "false"

      - name: "Install rootless Podman dependencies"
        run: "sudo apt-get install -y uidmap fuse-overlayfs slirp4netns"

      - name: "Configure rootless Podman"
        run: |
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$USER"
          fi
          if ! grep -q "^${USER}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$USER"
          fi
          runtime_dir="/run/user/$(id -u)"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$runtime_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: "Build image builder"
        run: "cargo build --locked"

      - name: "Check E2E assertion guards"
        run: "cargo test --locked --test e2e_test"

      - name: "Initialize isolated E2E state"
        uses: ./.github/actions/initialize-openshell
        with:
          driver: "podman"
          artifacts: "${{ env.E2E_ARTIFACTS }}"

      - name: "Install checksum-verified OpenShell"
        id: "openshell"
        timeout-minutes: 8
        uses: ./.github/actions/install-openshell
        with:
          platform: "linux-x86_64"
          directory: "${{ env.E2E_DIR }}/bin"
          checksum-command: "sha256sum --check"

      - name: "Set expected OpenShell version"
        env:
          VERSION: "${{ steps.openshell.outputs.version }}"
        run: echo "E2E_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: "Build and inspect the test image"
        timeout-minutes: 20
        run: |
          touch "$E2E_DIR/image-build-started"
          (cd "$E2E_DIR"; "$GITHUB_WORKSPACE/target/debug/openshell-build-image" \
            --runtime podman --from "$E2E_BASE_IMAGE" --copy-containerfile -v "$E2E_IMAGE") \
            > "$E2E_ARTIFACTS/image-build.log" 2>&1
          podman create --name "$E2E_NAME-image-check" --network none "$E2E_IMAGE"
          podman cp "$E2E_NAME-image-check:/root/Containerfile" "$E2E_ARTIFACTS/Containerfile"
          podman rm --force "$E2E_NAME-image-check"
          echo "E2E_SOURCE=$E2E_IMAGE" >> "$GITHUB_ENV"
          grep -Fx "FROM $E2E_BASE_IMAGE AS system" "$E2E_ARTIFACTS/Containerfile"

      - name: "Start the owned Podman service"
        run: |
          podman info > "$E2E_ARTIFACTS/podman-info.log"
          podman network create "$E2E_NAME"
          touch "$E2E_DIR/network-created"
          set -m
          nohup podman system service --time=0 "unix://$E2E_DIR/podman.sock" \
            < /dev/null > "$E2E_ARTIFACTS/podman-service.log" 2>&1 &
          echo "$!" > "$E2E_DIR/podman-service.pid"
          set +m
          for attempt in {1..30}; do
            kill -0 "$(cat "$E2E_DIR/podman-service.pid")"
            [ ! -S "$E2E_DIR/podman.sock" ] || break
            sleep 1
          done
          test -S "$E2E_DIR/podman.sock"

      - name: "Configure the podman driver"
        run: |
          cat > "$E2E_DIR/driver.toml" <<EOF
          socket_path = "$E2E_DIR/podman.sock"
          network_name = "$E2E_NAME"
          gateway_port = __GATEWAY_PORT__
          image_pull_policy = "if_not_present"
          stop_timeout_secs = 10
          supervisor_image = "ghcr.io/nvidia/openshell/supervisor:$E2E_VERSION"
          sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:$E2E_VERSION"
          EOF

      - name: "Start the OpenShell gateway"
        timeout-minutes: 3
        uses: ./.github/actions/start-openshell-gateway
        with:
          driver-settings: "${{ env.E2E_DIR }}/driver.toml"

      - name: "Create the sandbox from the built image"
        timeout-minutes: 6
        uses: ./.github/actions/create-openshell-sandbox
        with:
          image: "${{ env.E2E_SOURCE }}"
          policy: "tests/e2e/policy.yaml"

      - name: "Verify blocked and approved curl requests"
        timeout-minutes: 5
        run: "cargo test --locked --test e2e_test network_policy -- --ignored --nocapture --test-threads=1"

      - name: "Collect OpenShell runtime diagnostics"
        if: "always()"
        timeout-minutes: 2
        uses: ./.github/actions/collect-openshell-diagnostics

      - name: "Collect podman runtime diagnostics"
        if: "always()"
        timeout-minutes: 2
        run: |
          if [ -z "${E2E_DIR:-}" ] || [ ! -d "$E2E_DIR" ]; then exit 0; fi
          podman ps --all --filter "label=openshell.ai/sandbox-name=$E2E_NAME" --format '{{.ID}}' \
            > "$E2E_ARTIFACTS/runtime-containers.log"
          while IFS= read -r container; do
            [ -n "$container" ] || continue
            podman logs --tail 500 "$container" > "$E2E_ARTIFACTS/runtime-$container.log" 2>&1 || true
            # State only: full metadata may contain credentials.
            podman inspect --format '{{json .State}}' "$container" \
              > "$E2E_ARTIFACTS/runtime-$container-state.json" || true
          done < "$E2E_ARTIFACTS/runtime-containers.log"

      - name: "Delete sandbox and stop owned processes"
        if: "always()"
        timeout-minutes: 3
        uses: ./.github/actions/stop-openshell

      - name: "Remove podman test resources"
        if: "always()"
        timeout-minutes: 3
        run: |
          if [ -z "${E2E_DIR:-}" ] || [ ! -d "$E2E_DIR" ]; then exit 0; fi
          failed=0
          podman rm --force --ignore "$E2E_NAME-image-check" || failed=1
          if [ -f "$E2E_DIR/image-build-started" ] && podman image exists "$E2E_IMAGE"; then
            podman image rm --force "$E2E_IMAGE" || failed=1
          fi
          if [ -f "$E2E_DIR/network-created" ]; then
            podman network rm "$E2E_NAME" || failed=1
          fi
          rm -rf "$E2E_DIR"
          exit "$failed"

      - name: "Upload diagnostics"
        if: "always()"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "e2e-podman-${{ matrix.name }}"
          path: "${{ env.E2E_ARTIFACTS }}"
          if-no-files-found: "ignore"
          retention-days: 7

  build-vm-rootfs:
    name: "Prepare the image builder's VM rootfs"
    uses: ./.github/workflows/build-vm-rootfs.yml
    with:
      retention-days: 1

  vm:
    name: "VM on macOS (${{ matrix.name }})"
    runs-on: ["self-hosted", "macos", "arm64"]
    timeout-minutes: 30
    needs: "build-vm-rootfs"
    environment: "integration"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: "ubuntu"
            # buildpack-deps:noble-curl; multi-architecture manifest.
            image: "docker.io/library/buildpack-deps@sha256:48a80dfb7e2f2d1e93dbfff934fd2f187f306eef36cb5359ef8bba0ffe9205b3"
          - name: "alpine"
            # alpine/curl:8.22.0; multi-architecture manifest.
            image: "docker.io/alpine/curl@sha256:3f21f10cf24835f7baae20931f18640cc30915ea4151363fe4d8fb59ee296dfb"
    env:
      E2E_BASE_IMAGE: "${{ matrix.image }}"
      E2E_DRIVER: "vm"
      E2E_ARTIFACTS: "target/e2e/vm/${{ matrix.name }}"
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 stable
        with:
          toolchain: "stable"

      - name: "Set VM build environment"
        run: |
          PREFIX=$(brew --prefix)
          echo "LIBCLANG_PATH=$PREFIX/opt/llvm/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$PREFIX/opt/llvm/lib:$PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"
          echo "$PREFIX/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"
          echo "$PREFIX/opt/openssl@3/bin" >> "$GITHUB_PATH"
          echo "E2E_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"

      - name: "Check VM prerequisites"
        run: |
          test "$(sysctl -n kern.hv_support)" = 1
          pkg-config --exists libkrun
          test -f "$LIBCLANG_PATH/libclang.dylib"
          command -v mke2fs
          command -v debugfs
          command -v jq

      - name: "Download VM rootfs"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "vm-rootfs"

      - name: "Build and sign image builder"
        run: "make build-vm"

      - name: "Check E2E assertion guards"
        run: "cargo test --locked --test e2e_test"

      - name: "Initialize isolated E2E state"
        uses: ./.github/actions/initialize-openshell
        with:
          driver: "vm"
          artifacts: "${{ env.E2E_ARTIFACTS }}"
          library-path: "${{ env.E2E_LIBRARY_PATH }}"

      - name: "Install checksum-verified OpenShell"
        id: "openshell"
        timeout-minutes: 8
        uses: ./.github/actions/install-openshell
        with:
          platform: "macos-arm64"
          directory: "${{ env.E2E_DIR }}/bin"
          checksum-command: "shasum -a 256 --check"

      - name: "Set expected OpenShell version"
        env:
          VERSION: "${{ steps.openshell.outputs.version }}"
        run: echo "E2E_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: "Sign the OpenShell VM driver"
        run: |
          codesign --sign - --force --entitlements entitlements.plist "$E2E_DIR/bin/openshell-driver-vm"

      - name: "Build and inspect the test image"
        timeout-minutes: 20
        run: |
          touch "$E2E_DIR/image-build-started"
          mkdir "$E2E_DIR/build-rootfs"
          tar -xf vm-rootfs.tar -C "$E2E_DIR/build-rootfs"
          (cd "$E2E_DIR"; DYLD_LIBRARY_PATH="$(brew --prefix)/lib" \
            "$GITHUB_WORKSPACE/target/release/openshell-build-image" \
            --runtime vm --from "$E2E_BASE_IMAGE" --copy-containerfile -v \
            --vm-rootfs "$E2E_DIR/build-rootfs" --vm-output "$E2E_DIR/image.tar" "$E2E_IMAGE") \
            > "$E2E_ARTIFACTS/image-build.log" 2>&1
          tar -tf "$E2E_DIR/image.tar" > "$E2E_ARTIFACTS/image-contents.log"
          tar -xOf "$E2E_DIR/image.tar" ./root/Containerfile > "$E2E_ARTIFACTS/Containerfile"
          echo "E2E_SOURCE=$E2E_DIR/image.tar" >> "$GITHUB_ENV"
          grep -Fx "FROM $E2E_BASE_IMAGE AS system" "$E2E_ARTIFACTS/Containerfile"

      - name: "Configure the vm driver"
        run: |
          cat > "$E2E_DIR/driver.toml" <<EOF
          allow_driver_config = true
          driver_dir = "$E2E_DIR/bin"
          state_dir = "$E2E_DIR/vm"
          bootstrap_image = "$E2E_BOOTSTRAP_IMAGE"
          overlay_disk_mib = 4096
          sandbox_uid = 10001
          sandbox_gid = 10001
          EOF

      - name: "Start the OpenShell gateway"
        timeout-minutes: 3
        uses: ./.github/actions/start-openshell-gateway
        with:
          driver-settings: "${{ env.E2E_DIR }}/driver.toml"

      - name: "Create the sandbox from the built image"
        timeout-minutes: 6
        uses: ./.github/actions/create-openshell-sandbox
        with:
          image: "${{ env.E2E_SOURCE }}"
          policy: "tests/e2e/policy.yaml"

      - name: "Verify blocked and approved curl requests"
        timeout-minutes: 5
        run: "cargo test --locked --test e2e_test network_policy -- --ignored --nocapture --test-threads=1"

      - name: "Collect OpenShell runtime diagnostics"
        if: "always()"
        timeout-minutes: 2
        uses: ./.github/actions/collect-openshell-diagnostics

      - name: "Collect vm runtime diagnostics"
        if: "always()"
        timeout-minutes: 2
        run: |
          if [ -z "${E2E_DIR:-}" ] || [ ! -d "$E2E_DIR" ]; then exit 0; fi
          if [ -d "$E2E_DIR/vm" ]; then
            # Copy logs before deletion removes them; leave keys and disks private.
            find "$E2E_DIR/vm" -type f -name '*.log' -print0 | while IFS= read -r -d '' logfile; do
              relative="${logfile#"$E2E_DIR/vm/"}"
              destination="$E2E_ARTIFACTS/vm/$relative"
              mkdir -p "$(dirname "$destination")"
              cp "$logfile" "$destination"
            done
          fi

      - name: "Delete sandbox and stop owned processes"
        if: "always()"
        timeout-minutes: 3
        uses: ./.github/actions/stop-openshell

      - name: "Remove vm test resources"
        if: "always()"
        timeout-minutes: 3
        run: |
          if [ -n "${E2E_DIR:-}" ]; then rm -rf "$E2E_DIR"; fi
          rm -f -- ./vm-rootfs.tar

      - name: "Upload diagnostics"
        if: "always()"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "e2e-vm-${{ matrix.name }}"
          path: "${{ env.E2E_ARTIFACTS }}"
          if-no-files-found: "ignore"
          retention-days: 7

      - name: "Remove VM diagnostics from the runner"
        if: "always()"
        run: rm -rf -- "$E2E_ARTIFACTS"

  # Stable required-check names cover both image variants, including failures or skips.
  podman-check:
    name: "Podman on Linux"
    runs-on: "ubuntu-26.04"
    needs: "podman"
    if: "always()"
    steps:
      - name: "Require both Podman image variants to pass"
        env:
          RESULT: "${{ needs.podman.result }}"
        run: test "$RESULT" = success

  vm-check:
    name: "VM on macOS"
    runs-on: "ubuntu-26.04"
    needs: "vm"
    if: "always()"
    steps:
      - name: "Require both VM image variants to pass"
        env:
          RESULT: "${{ needs.vm.result }}"
        run: test "$RESULT" = success
