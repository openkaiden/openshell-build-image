name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # The root filesystem the vm runtime boots from, embedded into the one
  # binary that can use it. Building it needs podman on native arm64, so it
  # cannot happen on the macOS job that consumes it.
  build-rootfs:
    name: Build the VM rootfs
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Build VM rootfs
        run: ./crates/vm-image-builder/vm-image/make-rootfs.sh ./vm-rootfs ./vm-rootfs.tar

      - name: Upload rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-rootfs
          path: vm-rootfs.tar

  build:
    runs-on: ${{ matrix.runner }}
    needs: build-rootfs
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-26
          # libkrun builds on Hypervisor.framework, which exists only here, so
          # this is the only target that ships `--runtime vm`.
          - target: aarch64-apple-darwin
            runner: macos-26
            vm: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026
          - target: aarch64-pc-windows-msvc
            runner: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          cargo set-version "${VERSION#v}"

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --locked

      # Only for the vm target. The compile guard in vm-runtime.yml runs the
      # same install on every pull request, so a tap that stops publishing a
      # bottle for this runner shows up there rather than in a release.
      - name: Install libkrun
        if: matrix.vm == true
        run: |
          brew tap libkrun/krun
          brew trust libkrun/krun
          brew install libkrun/krun/libkrun pkgconf

      - name: Set build environment
        if: matrix.vm == true
        run: |
          PREFIX=$(brew --prefix)
          # krun-sys generates its bindings with bindgen, which needs libclang.
          if [ -d "$PREFIX/opt/llvm/lib" ]; then
            LIBCLANG="$PREFIX/opt/llvm/lib"
          else
            LIBCLANG="$(xcode-select -p)/usr/lib"
          fi
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$LIBCLANG:$PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Download rootfs
        if: matrix.vm == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-rootfs

      - name: Build
        if: matrix.use_cross != true && matrix.vm != true
        run: cargo build --release --target ${{ matrix.target }}

      # The rootfs is embedded here, so the released binary boots a VM without
      # the user building a filesystem for it first.
      - name: Build (vm)
        if: matrix.vm == true
        run: cargo build --release --target ${{ matrix.target }} --features vm
        env:
          OPENSHELL_IMAGE_BUILDER_VM_ROOTFS_ARCHIVE: ${{ github.workspace }}/vm-rootfs.tar

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign binary
        if: runner.os == 'macOS' && matrix.vm != true
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" \
            | grep "Developer ID Application" \
            | awk '{print $2}')
          codesign \
            --deep \
            --force \
            --sign "$IDENTITY" \
            --options runtime \
            target/${{ matrix.target }}/release/openshell-image-builder

      # macOS denies Hypervisor.framework to any process whose signature lacks
      # the entitlement, so the vm binary carries it. Read it back rather than
      # trusting codesign to have applied it: without it the binary ships and
      # fails only when a user asks for a VM build.
      - name: Sign binary (vm)
        if: matrix.vm == true
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" \
            | grep "Developer ID Application" \
            | awk '{print $2}')
          codesign \
            --deep \
            --force \
            --sign "$IDENTITY" \
            --options runtime \
            --entitlements entitlements.plist \
            target/${{ matrix.target }}/release/openshell-image-builder
          codesign -d --entitlements :- \
            target/${{ matrix.target }}/release/openshell-image-builder | \
            grep -q "com.apple.security.hypervisor"

      - name: Notarize binary
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          zip -j "$RUNNER_TEMP/openshell-image-builder.zip" \
            target/${{ matrix.target }}/release/openshell-image-builder
          xcrun notarytool submit "$RUNNER_TEMP/openshell-image-builder.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Clean up keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshell-image-builder-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/openshell-image-builder${{ contains(matrix.target, 'windows') && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Rename artifacts with platform suffix
        run: |
          for dir in artifacts/*/; do
            platform=$(basename "$dir")
            if [ -f "$dir/openshell-image-builder.exe" ]; then
              mv "$dir/openshell-image-builder.exe" "$dir/$platform.exe"
            elif [ -f "$dir/openshell-image-builder" ]; then
              mv "$dir/openshell-image-builder" "$dir/$platform"
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/**/*

  bump-next-version:
    name: Bump Next Version
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Compute next version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0-next"
          echo "next_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT

      - name: Bump version
        run: cargo set-version "${{ steps.version.outputs.next_version }}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.KAIDEN_BOT_TOKEN }}
        run: |
          BRANCH="bump-next-${{ steps.version.outputs.next_version }}"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.version.outputs.next_version }}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: bump version to ${{ steps.version.outputs.next_version }}" \
            --body "Bump version to \`${{ steps.version.outputs.next_version }}\` after release \`${{ github.ref_name }}\`." \
            --base main \
            --head "$BRANCH")
          echo "Pull request created: ${PR_URL}"
          gh pr ready "${PR_URL}"
          gh pr merge "${PR_URL}" --auto --rebase
